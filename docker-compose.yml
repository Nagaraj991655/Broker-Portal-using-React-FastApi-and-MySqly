services:

  mysql:
    image: mysql:8

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: Sayoojyam95@
      MYSQL_DATABASE: motor_broker

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pSayoojyam95@"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    container_name: backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

  frontend:
    build: ./frontend

    container_name: frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"
