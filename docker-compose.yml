services:

  mysql:
    image: mysql:8

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: Sayoojyam95@
      MYSQL_DATABASE: motor_broker

    ports:
      - "3306:3306"

  backend:
    build: ./backend

    container_name: backend

    depends_on:
      - mysql

    ports:
      - "8000:8000"

  frontend:
    build: ./frontend

    container_name: frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"
